# Copy to gulliver.toml (or point GULLIVER_CONFIG at it).
# Credentials never go here: each engine reads its own environment variables / credential chain.

default_connection = "local"

[connections.local]
engine = "duckdb"
path = "warehouse.duckdb"
# allow_write = true        # a human must set this before CREATE/INSERT ... SELECT can run
# allowed_paths = ["data", "/srv/lake"]   # folders DuckDB may read (default: database folder + current folder)
# allow_remote = ["s3://my-bucket/"]      # or true for any URL (default false)
# allow_functions = ["read_text"]         # lift the GS name check for these functions
# sandbox = true                          # false turns off the DuckDB engine sandbox (the parser still checks)

# [connections.local.policy]              # result guard (default: secrets masked, personal data flagged)
# pii = "warn"                            # allow | warn | mask | hash | last4 | deny
# secrets = "mask"
# injection = "warn"                      # allow | warn | redact
# categories = { ssn = "deny", email = "hash" }

[connections.bq]
dsn = "bigquery://my-gcp-project?location=EU"   # auth: gcloud auth application-default login
dataset = "analytics"                           # used by `inspect` without a table
price_per_tib_usd = 6.25                        # on-demand price

[connections.sf]
engine = "snowflake"
account = "myorg-myaccount"
user = "ANALYST"
warehouse = "ANALYTICS_XS"
database = "PROD"
schema = "PUBLIC"
credits_per_hour = 1        # XS=1, S=2, M=4, L=8 ...
credit_usd = 3.00
# password from SNOWFLAKE_PASSWORD, or authenticator = "externalbrowser"

[connections.pg]
dsn = "postgresql://gulliver_ro@db.internal:5432/app"   # password from PGPASSWORD or ~/.pgpass
# Second layer of safety: connect with a role that can only read (run once as an admin):
#   CREATE ROLE gulliver_ro LOGIN PASSWORD '...';
#   GRANT CONNECT ON DATABASE app TO gulliver_ro;
#   GRANT USAGE ON SCHEMA public TO gulliver_ro;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO gulliver_ro;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO gulliver_ro;
#   ALTER ROLE gulliver_ro SET statement_timeout = '15min';            -- server-side guard
#   ALTER ROLE gulliver_ro SET default_transaction_read_only = on;

[budget]
max_query_usd = 1.00          # hard stop for one query
approval_over_usd = 0.25      # above this a human runs: gulliver approve <receipt_id>
rehearse_over_usd = 0.10      # above this a rehearsal is required before the full run
rehearse_over_bytes = 10737418240   # 10 GiB: same rule for free engines / unknown cost
max_bytes = 536870912000      # 500 GiB: hard stop on estimated scan
max_runtime_s = 900
day_usd = 10.00               # total per calendar day (UTC), from the local ledger
max_output_rows = 200         # rows handed back to the agent as a preview
# max_output_chars = 50000    # characters of preview JSON (0 = no limit)
# max_cell_chars = 1000       # longer text cells are cut
# session_usd = 3             # per agent session (0 = off)
# agent_day_usd = { default = 5, "claude-code" = 10 }   # per agent per day (absent = off)
# max_repeats = 5             # identical runs on unchanged tables per window before the loop guard blocks
# repeat_window_min = 30
# velocity_usd = 2.0          # one agent or session spending faster than this ...
# velocity_window_min = 10    # ... within this many minutes needs a human approval

[approval]
channel = "cli"               # cli: a human runs `gulliver approve <receipt_id>`
                              # elicitation: the MCP client asks its user (falls back to cli if it cannot)

# [lint]                      # files mode of `gulliver lint` (CI, pre-commit)
# disable = ["GV010"]
# severity = { GV006 = "error" }
# fail_on = "error"           # error | warn | info | never
# exclude = ["models/legacy/*"]

# [review]                    # `gulliver review` / the GitHub Action
# max_increase_pct = 100
# max_increase_usd = 50       # per month for the whole change
# runs_per_day = 1
# fail_on = ["cost", "breaking_with_downstream", "new_lint_error", "superlinear"]


# [checks.events]              # data quality checks: define once, run with `gulliver check events` or `gulliver check --all`
# target = "events"            # table or SELECT; defaults to the section name
# connection = "local"         # optional: connection name from [connections.*]
# where = "ts >= current_date - 7"
# unique = ["event_id"]        # composite key: ["event_id", ["user_id", "session_id"]] or "user_id,session_id"
# not_null = ["user_id", "amount"]
# accepted = { event_type = ["view", "click"] }
# range = { amount = [0, 10000] }   # either side may be omitted: [0, ""], ["", 100], [10]
# fresh = { ts = "24h" }
# min_rows = 1000
# max_change_pct = 20
