[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gulliver-mcp"
version = "0.4.0"
description = "Test on tiny data before you run on giant data. A dress rehearsal for data agents: estimate the cost, rehearse on 1% -> 10%, predict 100%, and only go full scale within budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "laaielichter" }]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "ai-agents",
  "llm",
  "claude-code",
  "codex",
  "cursor",
  "gemini-cli",
  "sql",
  "sql-linter",
  "text-to-sql",
  "query-optimization",
  "cost-optimization",
  "finops",
  "dry-run",
  "sampling",
  "data-engineering",
  "analytics-engineering",
  "data-quality",
  "data-lineage",
  "data-diff",
  "schema-drift",
  "dbt",
  "sqlglot",
  "duckdb",
  "postgres",
  "postgresql",
  "bigquery",
  "snowflake",
  "sarif",
  "pre-commit",
  "github-action",
  "pii",
  "prompt-injection",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "sqlglot>=25.0",
  "duckdb>=1.1",
  "mcp>=1.10",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
bigquery = ["google-cloud-bigquery>=3.20"]
snowflake = ["snowflake-connector-python>=3.10"]
all = [
  "psycopg[binary]>=3.1",
  "google-cloud-bigquery>=3.20",
  "snowflake-connector-python>=3.10",
]
dev = ["pytest>=8"]

[project.scripts]
gulliver = "gulliver.cli:main"
gulliver-mcp = "gulliver.mcp_server:main"

[project.urls]
Homepage = "https://laaielichter.github.io/Gulliver/"
Documentation = "https://github.com/laaielichter/Gulliver#readme"
Source = "https://github.com/laaielichter/Gulliver"
Issues = "https://github.com/laaielichter/Gulliver/issues"
Changelog = "https://github.com/laaielichter/Gulliver/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gulliver"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "AGENTS.md", "llms.txt", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "S"]
ignore = [
  "S608",   # SQL built from parts: Gulliver generates SQL on purpose; every query is parsed and gated
  "S101",   # assert in tests
  "SIM108", # ternaries are not always clearer
  "B904",
  "SIM105", # explicit try/except/pass reads better in cleanup code
  "S110",   # silent cleanup in close()/interrupt is intended
  "B027",   # optional hooks on the engine base class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
